name: One-off hourly rollover study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-hourly-rollover-study.yml'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch hourly USDTRY/USDJPY and compare weekday drift
        run: |
          mkdir -p analysis
          python - <<'PY'
          import json, math, statistics, time, urllib.parse, urllib.request
          from collections import defaultdict
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DATA = Path('data/usdtry.json')
          OUT = Path('analysis/tmp_hourly_rollover_study.json')
          JST = ZoneInfo('Asia/Tokyo')
          START = date(2026, 6, 15)
          END = datetime.now(timezone.utc) + timedelta(days=1)
          YAHOO = 'https://query1.finance.yahoo.com/v8/finance/chart'
          UA = {'User-Agent': 'Mozilla/5.0 USDTRY-rollover-study/1.1'}
          WEEKDAY = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']

          def fetch(symbol):
              p1 = int(datetime.combine(START, datetime.min.time(), tzinfo=timezone.utc).timestamp())
              p2 = int(END.timestamp())
              qs = urllib.parse.urlencode({'period1':p1,'period2':p2,'interval':'1h','includePrePost':'false','events':'history'})
              url = f"{YAHOO}/{urllib.parse.quote(symbol, safe='')}?{qs}"
              req = urllib.request.Request(url, headers=UA)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          payload = json.load(r)
                      result = payload['chart']['result'][0]
                      ts = result.get('timestamp') or []
                      closes = result['indicators']['quote'][0].get('close') or []
                      out=[]
                      for t,c in zip(ts,closes):
                          if c is None: continue
                          c=float(c)
                          if not math.isfinite(c) or c<=0: continue
                          dt=datetime.fromtimestamp(int(t), timezone.utc).astimezone(JST)
                          out.append((dt,c))
                      return out
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2+attempt*2)

          def fixed_daily(bars):
              grouped=defaultdict(list); excluded=defaultdict(list); allbars=defaultdict(list)
              for dt,val in bars:
                  key=dt.date().isoformat(); allbars[key].append(val)
                  if 5 <= dt.hour < 9: excluded[key].append(val)
                  else: grouped[key].append(val)
              result={}
              for key,vals in grouped.items():
                  if not vals: continue
                  result[key]={
                      'fixed_median': statistics.median(vals),
                      'included_samples': len(vals),
                      'excluded_05_09_samples': len(excluded.get(key,[])),
                      'all_day_median': statistics.median(allbars[key]),
                      'early_05_09_median': statistics.median(excluded[key]) if excluded.get(key) else None,
                  }
              return result

          swap=json.loads(DATA.read_text(encoding='utf-8'))
          usdtry=fixed_daily(fetch('USDTRY=X')); time.sleep(.7)
          usdjpy=fixed_daily(fetch('USDJPY=X'))

          weeks=[]
          for row in swap.get('data',[]):
              d=date.fromisoformat(row['date'])
              if d.weekday()!=3 or int(row.get('days') or 0)<3: continue
              thu=d.isoformat(); fri=(d+timedelta(days=1)).isoformat()
              if thu not in usdtry or fri not in usdtry or fri not in usdjpy: continue
              thu_rate=float(usdtry[thu]['fixed_median']); fri_rate=float(usdtry[fri]['fixed_median'])
              fri_usdjpy=float(usdjpy[fri]['fixed_median']); tryjpy=fri_usdjpy/fri_rate
              delta=fri_rate-thu_rate
              fx_loss_10k=10000*delta*tryjpy; swap_10k=float(row['sell_yen'])*10; net=swap_10k-fx_loss_10k
              weeks.append({
                  'thursday':thu,'friday':fri,'swap_days':int(row['days']),
                  'swap_jpy_10k':round(swap_10k,2),
                  'thu_fixed_usdtry':round(thu_rate,8),'fri_fixed_usdtry':round(fri_rate,8),
                  'thu_to_fri_delta_usdtry':round(delta,8),
                  'thu_to_fri_change_pct':round((fri_rate/thu_rate-1)*100,6),
                  'fri_fixed_usdjpy':round(fri_usdjpy,8),'fx_loss_jpy_10k':round(fx_loss_10k,2),
                  'swap_minus_fx_jpy_10k':round(net,2),
                  'fx_loss_as_pct_of_swap':round(fx_loss_10k/swap_10k*100,2) if swap_10k else None,
                  'thu_early_05_09_median':usdtry[thu]['early_05_09_median'],
                  'fri_early_05_09_median':usdtry[fri]['early_05_09_median'],
                  'thu_included_samples':usdtry[thu]['included_samples'],'fri_included_samples':usdtry[fri]['included_samples'],
              })

          transition=defaultdict(list)
          ordered=sorted((date.fromisoformat(k),v) for k,v in usdtry.items() if date.fromisoformat(k)>=date(2026,7,1))
          bydate={d:v for d,v in ordered}
          for d,v in ordered:
              n=d+timedelta(days=1)
              if n not in bydate: continue
              a=float(v['fixed_median']); b=float(bydate[n]['fixed_median'])
              pct=(b/a-1)*100
              transition[f"{WEEKDAY[d.weekday()]}->{WEEKDAY[n.weekday()]}"] .append(pct)

          weekday_stats={}
          for key,vals in transition.items():
              weekday_stats[key]={
                  'n':len(vals),
                  'mean_change_pct':round(statistics.mean(vals),6),
                  'median_change_pct':round(statistics.median(vals),6),
                  'min_change_pct':round(min(vals),6),
                  'max_change_pct':round(max(vals),6),
              }

          early_diffs=[]
          for k,v in usdtry.items():
              d=date.fromisoformat(k)
              if d<date(2026,7,1): continue
              e=v.get('early_05_09_median'); f=v.get('fixed_median')
              if e is not None and f:
                  early_diffs.append((float(e)/float(f)-1)*100)

          fx=[w['fx_loss_jpy_10k'] for w in weeks]; sw=[w['swap_jpy_10k'] for w in weeks]; net=[w['swap_minus_fx_jpy_10k'] for w in weeks]
          payload={
              'method':{
                  'daily_fixed_rate':'JST calendar-day median of Yahoo 1h closes excluding 05:00-08:59 JST',
                  'comparison':'Thursday fixed USDTRY to Friday fixed USDTRY on Hirose rows with Thursday and days>=3',
                  'fx_loss_jpy_10k':'10000 * (Fri USDTRY fixed - Thu USDTRY fixed) * (Fri fixed USDJPY / Fri fixed USDTRY)',
                  'swap_jpy_10k':'Hirose sell_yen * 10',
                  'note':'Positive FX loss means USDTRY rose, adverse for a short. 05:00-08:59 JST bars are excluded from fixed rates.'
              },
              'summary':{
                  'weeks':len(weeks),
                  'avg_swap_jpy_10k':round(statistics.mean(sw),2) if sw else None,
                  'avg_fx_loss_jpy_10k':round(statistics.mean(fx),2) if fx else None,
                  'avg_swap_minus_fx_jpy_10k':round(statistics.mean(net),2) if net else None,
                  'median_swap_minus_fx_jpy_10k':round(statistics.median(net),2) if net else None,
                  'weeks_fx_loss_exceeded_swap':sum(1 for w in weeks if w['fx_loss_jpy_10k']>w['swap_jpy_10k']),
                  'weeks_net_positive':sum(1 for w in weeks if w['swap_minus_fx_jpy_10k']>0),
                  'mean_early_05_09_vs_fixed_pct':round(statistics.mean(early_diffs),6) if early_diffs else None,
                  'median_early_05_09_vs_fixed_pct':round(statistics.median(early_diffs),6) if early_diffs else None,
              },
              'weekday_transition_stats':weekday_stats,
              'weeks':weeks,
          }
          OUT.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Commit temporary analysis result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/tmp_hourly_rollover_study.json
          git commit -m "analysis: compare weekday USDTRY drift"
          git pull --rebase origin main
          git push origin HEAD:main
