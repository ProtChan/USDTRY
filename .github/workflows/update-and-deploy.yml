name: Update USDTRY swap and deploy

on:
  schedule:
    # 10:30 JST every day (01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: usdtry-swap-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate scraper and chart code
        run: |
          python -m py_compile scripts/build_data.py
          node --check app.js

      - name: Fetch Hirose USDTRY swap
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdtry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update USDTRY swap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css mobile-fix.css app.js _site/
          cp data/usdtry.json _site/data/
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            cat /tmp/pages.json
            exit 0
          fi

          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' "$api")
          echo "Pages enable attempt: HTTP $create_code"
          cat /tmp/pages-create.json || true

          if [ "$create_code" = "201" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages could not be enabled with GITHUB_TOKEN; deployment is skipped without failing data updates."
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
