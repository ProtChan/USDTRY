name: Update USDTRY data and deploy

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 20-23 * * 0-4'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 0-4 * * 1-5'
    - cron: '37 6 * * 1-5'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: usdtry-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
      should_deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe Hirose for a new or revised row
        id: probe
        if: github.event_name == 'schedule' && github.event.schedule != '37 6 * * 1-5'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from scripts.build_data import SOURCE_PAGE, fetch_html, load_existing, parse_current_date, parse_usdtry_row

          changed = True
          current_date = 'unknown'
          reason = 'probe-error'
          try:
              page = fetch_html(SOURCE_PAGE)
              current_date = parse_current_date(page).isoformat()
              live = parse_usdtry_row(page)
              existing = load_existing()
              by_date = {row.get('date'): row for row in existing.get('data', []) if row.get('date')}
              old = by_date.get(current_date)
              keys = ('days', 'lot_size', 'sell_points', 'buy_points', 'sell_yen', 'buy_yen', 'sell_yen_per_day')
              changed = old is None or any(old.get(key) != live.get(key) for key in keys)
              reason = 'new-or-revised-row' if changed else 'unchanged'
          except Exception as exc:
              print(f'probe failed; forcing full pipeline: {exc}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'changed={str(changed).lower()}\n')
              out.write(f'current_date={current_date}\n')
              out.write(f'reason={reason}\n')
          print(f'Hirose probe: date={current_date} changed={changed} reason={reason}')
          PY

      - name: Decide whether to run full pipeline
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PROBE_CHANGED: ${{ steps.probe.outputs.changed }}
        run: |
          full=false
          reason="scheduled-no-change"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            full=true
            reason="pull-request-validation"
          elif [ "$EVENT_NAME" != "schedule" ]; then
            full=true
            reason="push-or-manual"
          elif [ "$SCHEDULE_EXPR" = "37 6 * * 1-5" ]; then
            full=true
            reason="forced-afternoon-refresh"
          elif [ "$PROBE_CHANGED" = "true" ]; then
            full=true
            reason="hirose-changed"
          fi
          deploy=false
          if [ "$full" = "true" ] && [ "$EVENT_NAME" != "pull_request" ]; then
            deploy=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Pipeline decision: full=$full deploy=$deploy reason=$reason"

      - uses: actions/setup-python@v5
        if: steps.decision.outputs.full == 'true'
        with:
          python-version: '3.12'

      - name: Validate source code
        if: steps.decision.outputs.full == 'true'
        run: |
          python -m py_compile scripts/build_data.py scripts/align_market_day.py scripts/update_data.py
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = ('trendChart', 'eventChart', 'returnChart', 'recentBody', 'app.js')
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'missing frontend hooks: {missing}')
          forbidden = ('chart-enhancements.js', 'return-chart.js', 'mobile-fix.css')
          stale = [item for item in forbidden if item in html]
          if stale:
              raise SystemExit(f'stale frontend layers referenced: {stale}')
          print('frontend static contract: PASS')
          PY

      - name: Run canonical data pipeline
        if: steps.decision.outputs.full == 'true'
        run: python scripts/update_data.py

      - name: Commit generated data
        if: steps.decision.outputs.full == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdtry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update USDTRY dashboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        if: steps.decision.outputs.full == 'true'
        run: |
          rm -rf _site
          mkdir -p _site/data _site/beta
          cp index.html styles.css app.js _site/
          cp data/usdtry.json _site/data/
          cp beta/index.html _site/beta/index.html
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        if: steps.decision.outputs.deploy == 'true'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" -d '{"build_type":"workflow"}' "$api")
          if [ "$create_code" = "201" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            cat /tmp/pages-create.json || true
          fi

      - name: Configure Pages
        if: steps.decision.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.decision.outputs.deploy == 'true' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.should_deploy == 'true' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
