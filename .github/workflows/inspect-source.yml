name: Inspect Hirose source

on:
  push:
    paths:
      - 'scripts/inspect_source.py'
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_source.py
