name: Test Hirose scraper

on:
  push:
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_data.py
      - run: |
          python - <<'PY'
          import json
          p=json.load(open('data/usdtry.json'))
          print(p['meta'])
          print('first', p['data'][0])
          print('last', p['data'][-1])
          PY
